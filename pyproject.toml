[project]
name = "churn-project"
version = "0.1.0"
description = "Customer churn model with data versioning and a reproducible DVC pipeline"
readme = "README.md"
authors = [{ name = "Salah Henchiri" }]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
]

[project.scripts]
churn-prepare = "churn_project.prepare:main"
churn-train = "churn_project.train:main"
churn-evaluate = "churn_project.evaluate:main"
churn-register = "churn_project.registry:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax, N: naming
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = ["N803", "N806"]  # allow X, X_train (usual ML notation)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
