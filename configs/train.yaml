# Every value that changes the trained model is set here, not in the code.
data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  path: data/raw/telco_churn.csv

split:
  test_size: 0.25
  seed: 0
  cv_folds: 5        # cross-validation on the training part, used to compare models

model:
  type: logistic_regression
  params:
    C: 1.0
    max_iter: 1000

mlflow:
  experiment: churn
  registered_model: churn-model
