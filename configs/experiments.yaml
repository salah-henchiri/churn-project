# Model configurations compared in one experiment (Section 3.6).
# Each entry overrides the `model` section of configs/train.yaml.
runs:
  - name: logreg-C0.01
    type: logistic_regression
    params: {C: 0.01, max_iter: 1000}
  - name: logreg-C0.1
    type: logistic_regression
    params: {C: 0.1, max_iter: 1000}
  - name: logreg-C1
    type: logistic_regression
    params: {C: 1.0, max_iter: 1000}
  - name: logreg-C10
    type: logistic_regression
    params: {C: 10.0, max_iter: 1000}
  - name: hgb-lr0.05-leaves8
    type: hist_gradient_boosting
    params: {learning_rate: 0.05, max_iter: 200, max_leaf_nodes: 8, random_state: 0}
  - name: hgb-lr0.05-leaves31
    type: hist_gradient_boosting
    params: {learning_rate: 0.05, max_iter: 200, max_leaf_nodes: 31, random_state: 0}
  - name: hgb-lr0.2-leaves8
    type: hist_gradient_boosting
    params: {learning_rate: 0.2, max_iter: 200, max_leaf_nodes: 8, random_state: 0}
  - name: hgb-lr0.2-leaves31
    type: hist_gradient_boosting
    params: {learning_rate: 0.2, max_iter: 200, max_leaf_nodes: 31, random_state: 0}
