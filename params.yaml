# Every value that changes the prepared data or the trained model is set here.
# DVC reads this file: when a value used by a stage changes, the stage is re-run.
data:
  raw: data/raw/telco_churn.csv

split:
  test_size: 0.25
  seed: 0
  cv_folds: 5        # cross-validation on the training part, used to compare models

model:
  type: logistic_regression
  params:
    C: 1.0
    max_iter: 1000

mlflow:
  experiment: churn
  registered_model: churn-model
